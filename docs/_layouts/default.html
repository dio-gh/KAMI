<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f2">
  <title>{{ page.title | default: site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ '/assets/images/social.png' | absolute_url }}">
  <meta property="og:image:alt" content="KAMI — Kot and Mouse Injector. Mouse control for emulated games.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="KAMI home">
        <img src="{{ '/assets/images/kami-small.svg' | relative_url }}" width="32" height="32" alt="">
        <span>KAMI</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="{{ site.links.compatibility }}">Compatibility</a>
        <a href="{{ site.links.source }}">GitHub <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main" tabindex="-1">{{ content }}</main>
    <footer class="site-footer">
      <p><strong>KAMI</strong><span>Kot and Mouse Injector</span></p>
      <nav aria-label="Project links">
        <a href="{{ site.links.source }}">Source</a>
        <a href="{{ site.links.releases }}">Releases</a>
        <a href="{{ site.links.license }}">MIT license</a>
      </nav>
    </footer>
  </div>
</body>
</html>
