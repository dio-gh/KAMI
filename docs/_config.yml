title: KAMI
description: Mouse control for supported emulated games. Kot and Mouse Injector brings familiar mouse input to RPCS3 and PCSX2.
baseurl: /KAMI
lang: en
timezone: UTC

# GitHub Pages supplies site.url for the repository that builds this site.
links:
  source: https://github.com/isJuhn/KAMI
  download: https://github.com/isJuhn/KAMI/releases/latest
  releases: https://github.com/isJuhn/KAMI/releases
  compatibility: https://isjuhn.github.io/index.html
  setup: https://github.com/isJuhn/KAMI#running
  runtime: https://dotnet.microsoft.com/en-us/download/dotnet/10.0
  license: https://github.com/isJuhn/KAMI/blob/master/LICENSE

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
